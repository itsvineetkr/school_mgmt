{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href={% static 'css/schools/dashboard.css' %}>
    {% block style %}{% endblock style %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Indie+Flower&family=Jua&family=Lexend:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="title"><a href="/">VedIQ</a></div>
            {% block sidebarButtons %}{% endblock sidebarButtons %}
        </div>
        <div class="wrapper">
            <div class="navbar">
                <div class="nav-button"><i class="fa-solid fa-bars"></i></div>
                <div class="navbar-icons">
                    <a href="">Notifications</a>
                    <a href="">Profile</a>
                </div>
            </div>
            <div class="content">
                {% block content %}{% endblock content %}
            </div>
        </div>
    </div>
</body>

<script>
    const navButton = document.querySelector('.nav-button');
    const sidebar = document.querySelector('.sidebar');

    navButton.addEventListener('click', () => {
        sidebar.style.left = '0';
    });

    document.querySelector('.wrapper').addEventListener('click', (event) => {
        if (!navButton.contains(event.target)) {
            sidebar.style.left = '-100%';
        }
    });

</script>
{% block script %}{% endblock script %}
</html>

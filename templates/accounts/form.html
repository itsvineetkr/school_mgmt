{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block pageTitle %}{% endblock pageTitle %}</title>
    <link rel="stylesheet" href={% static 'css/accounts/base.css' %}>
    <link rel="stylesheet" href={% static 'css/accounts/form.css' %}>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" {% load static %}href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Indie+Flower&family=Jua&family=Lexend:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="home">
        <header>
            <nav>
                <p>VedIQ</p>
                <ul>
                    <li><a href="">About Us</a></li>
                    <li><a href="">Features</a></li>
                    <li><a href="">Contact Us</a></li>
                    <li><a href="">Login</a></li>
                </ul>
                <div class="nav-button">
                    <i class="fa-solid fa-bars"></i>
                </div>
            </nav>
            <div class="dropdown">
                <ul>
                    <li><a href="" class="dropdown-a">About Us</a></li>
                    <li><a href="" class="dropdown-a">Features</a></li>
                    <li><a href="" class="dropdown-a">Contact Us</a></li>
                    <li><a href="" class="dropdown-a">Login</a></li>
                </ul>
            </div>
        </header>
        <div class="container">
            <form method="post">
                {% csrf_token %}
                <div class="title">{% block formTitle %}{% endblock formTitle %}</div>
                {% block fields %}{% endblock fields %}
            </form>
        </div>
    </div>
    <script>
        document.querySelector(".nav-button").addEventListener("click", function(){
            const dropdown = document.querySelector(".dropdown")
            const body = document.querySelector("body")
            if (dropdown.style.display == "flex"){
                dropdown.style.display = "none"
                body.style.overflowY = "auto"
            }
            else{
                dropdown.style.display = "flex"
                body.style.overflowY = "hidden"
            }
        });

        const dropdownLinks = document.querySelectorAll('.dropdown a');
        dropdownLinks.forEach(link => {
            link.addEventListener('click', (event) => {
                const dropdown = document.querySelector(".dropdown")
                const body = document.querySelector("body")
                if (dropdown.style.display == "flex"){
                    dropdown.style.display = "none"
                    body.style.overflowY = "auto"
                }
            });
        });
    </script>
</body>


</html>
